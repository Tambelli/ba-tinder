services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_DEMO: ${APP_DEMO:-true}
      MATCH_MODE: ${MATCH_MODE:-MEDIATED}
      COMMISSION_MODE: ${COMMISSION_MODE:-INCLUDED}
      BRAND_PASSWORD: ${BRAND_PASSWORD:-}
      OPS_PASSWORD: ${OPS_PASSWORD:-}
      CREATOR_PASSWORD: ${CREATOR_PASSWORD:-}
      DATABASE_BASELINE: ${DATABASE_BASELINE:-false}
    volumes:
      - match-data:/app/data
volumes:
  match-data:
