spring.application.name=ba-tinder
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/match;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
app.demo=${APP_DEMO:false}
app.match-mode=${MATCH_MODE:MEDIATED}
app.commission-mode=${COMMISSION_MODE:INCLUDED}
app.brand-password=${BRAND_PASSWORD:}
app.ops-password=${OPS_PASSWORD:}
app.creator-password=${CREATOR_PASSWORD:}
